# Web del srv-dmz (mismas rutas que usan los escenarios del panel)
server {
    listen 80;
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/cyberflow.crt;
    ssl_certificate_key /etc/nginx/cyberflow.key;
    root /var/www/cyberflow;
    access_log off;

    location / { try_files $uri $uri/ =404; }
    # login de formulario: cualquier intento sin credencial válida -> 401
    location = /login { return 401 "credenciales incorrectas\n"; }
}

# Endpoint con autenticación básica (escenario «Fuerza bruta HTTP»)
server {
    listen 8081;
    server_name _;
    root /var/www/cyberflow;
    access_log off;
    location / {
        auth_basic "CyberFlow";
        auth_basic_user_file /etc/nginx/htpasswd;
        try_files $uri $uri/ /index.html;
    }
}
